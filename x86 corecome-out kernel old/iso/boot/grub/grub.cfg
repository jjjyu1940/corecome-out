# alpOS ISO 引导菜单。GRUB 2.06+ 直接支持 multiboot2，加载 ELF 后按
# multiboot2 协议把控制权交给我们：RAX=MULTIBOOT2_BOOTLOADER_MAGIC，
# RBX=mb_info 物理地址，CPU 处于 32-bit 保护模式、可分页（但 GRUB 不
# 保证分页开）、A20 已开。
set timeout=5
set default=0

menuentry "alpOS (x86_64)" {
    insmod all_video
    loadfont ascii
    set gfxmode=text
    terminal_output console

    multiboot2 /boot/alpos-kernel.elf
    # 预留：module2 /boot/initrd.img 可由 tools/image/mkiso.sh 追加
    boot
}

menuentry "alpOS (serial 115200 8N1)" {
    multiboot2 /boot/alpos-kernel.elf
    boot
}

menuentry "alpOS (no KVM, safe)" {
    multiboot2 /boot/alpos-kernel.elf noapic
    boot
}
